gen.add("kp_pos", double_t, 0, "Position Kp", 1.2, 0.0, 5.0)
gen.add("ki_pos", double_t, 0, "Position Ki", 0.0, 0.0, 5.0)
gen.add("kd_pos", double_t, 0, "Position Kd", 0.0, 0.0, 5.0)

gen.add("kp_yaw", double_t, 0, "Yaw Kp", 3.0, 0.0, 5.0)
