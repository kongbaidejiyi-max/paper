PACKAGE = "ego_planner"  # ← 改成你的包名

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("max_linear_vel",  double_t, 0, "Max linear velocity (m/s)", 1.0, 0.0, 5.0)
